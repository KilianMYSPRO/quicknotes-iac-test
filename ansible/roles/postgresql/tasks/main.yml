- name: Installer PostgreSQL et la librairie Python requise par les modules Ansible
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - python3-psycopg2
      - acl   # necessaire pour become_user vers un utilisateur non privilegie
    state: present

- name: Ecouter sur toutes les interfaces (pas seulement localhost)
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"
  notify: Redemarrer PostgreSQL

- name: Autoriser le reseau applicatif dans pg_hba.conf
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    line: "host  {{ db_name }}  {{ db_user }}  {{ postgresql_allowed_network }}  scram-sha-256"
  notify: Redemarrer PostgreSQL

- name: PostgreSQL demarre et active au boot
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Creer l'utilisateur de la base
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
  become: true
  become_user: postgres
  no_log: true   # ne jamais afficher un mot de passe dans les logs

- name: Creer la base de donnees
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
  become: true
  become_user: postgres

# A COMPLETER : role postgresql (voir TP2, partie 3.2)
# 1. Installer postgresql-{{ postgresql_version }}, python3-psycopg2 et acl
# 2. postgresql.conf : listen_addresses = '*'            (lineinfile + regexp, notify)
# 3. pg_hba.conf : autoriser {{ db_user }} depuis {{ postgresql_allowed_network }}   (lineinfile, notify)
# 4. Service postgresql demarre et active au boot
# 5. Creer l'utilisateur {{ db_user }}  (community.postgresql.postgresql_user, en tant que postgres, no_log)
# 6. Creer la base {{ db_name }}         (community.postgresql.postgresql_db, en tant que postgres)

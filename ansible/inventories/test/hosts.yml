# Inventaire de l'environnement TEST
# Dans le lab, on reutilise les memes machines : seules les VARIABLES changent.
# En entreprise, ce seraient d'autres serveurs.
# Les noms web1 et db1 sont resolus par le reseau Docker du lab.
all:
  vars:
    ansible_user: student
    ansible_python_interpreter: /usr/bin/python3
  children:
    web:
      hosts:
        web1:
          ansible_host: web1
    app:
      hosts:
        web1:
    db:
      hosts:
        db1:
          ansible_host: db1

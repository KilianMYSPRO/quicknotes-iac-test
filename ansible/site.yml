# Playbook principal : deploie QuickNotes sur les VM
# Lancement : ansible-playbook site.yml
- name: Socle commun a tous les serveurs
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common]

- name: Base de donnees PostgreSQL
  hosts: db
  become: true
  roles:
    - postgresql

- name: Application QuickNotes
  hosts: app
  become: true
  roles:
    - app

- name: Reverse proxy Nginx
  hosts: web
  become: true
  roles:
    - nginx

- name: Test de fumee (smoke test)
  hosts: web
  gather_facts: false
  tasks:
    # En mode --check, rien n'est vraiment deploye : on saute le test.
    - name: La page /health repond 200 a travers Nginx
      ansible.builtin.uri:
        # Surchargeable : -e smoke_test_url=http://IP:PORT/health (port redirige, rebond...)
        url: "{{ smoke_test_url | default('http://' ~ ansible_host ~ '/health') }}"
        status_code: 200
      delegate_to: localhost
      register: health
      retries: 5
      delay: 3
      until: health.status == 200
      when: not ansible_check_mode

    - name: Afficher le resultat
      ansible.builtin.debug:
        var: health.json
      when: not ansible_check_mode

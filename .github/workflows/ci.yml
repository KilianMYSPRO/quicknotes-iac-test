# =============================================================================
#  TP5 : pipeline CI de QuickNotes  (SQUELETTE : completez les TODO)
#  3 jobs : 1. lint  ->  2. securite  ->  3. build (+ publication GHCR sur main)
#  Verifier la syntaxe AVANT de pousser (a la racine du depot) :
#    docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
# =============================================================================
name: CI

# TODO 1 : declencher le workflow
#   - sur chaque pull_request
#   - sur chaque push sur la branche main
#   - a la main (workflow_dispatch)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# TODO 2 : moindre privilege. Par defaut, le jeton GITHUB_TOKEN doit seulement
#          pouvoir LIRE le code (contents: read).
permissions:
  contents: read

# Un nouveau push sur la meme branche annule le run precedent (economie de minutes).
# NB : une expression ${{ }} ici ferait ignorer CE fichier par checkov, sans erreur.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: 1. Lint et validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Les actions sont epinglees par SHA de commit (immuable) : voir la question 2 du TP
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer ansible-lint et yamllint
        run: pip install --quiet "ansible-lint==26.10.1" "yamllint==1.38.0"

      # Fourni : ansible.cfg cherche .vault_pass, absent en CI (gitignore).
      # On lui donne le secret GitHub ANSIBLE_VAULT_PASSWORD s'il existe, sinon un mot de passe factice.
      - name: ansible-lint (profil production)
        working-directory: ansible
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          ansible-galaxy collection install -r requirements.yml >/dev/null
          VP="$RUNNER_TEMP/vault_pass"
          printf '%s\n' "${VAULT_PASS:-mot-de-passe-factice-ci}" > "$VP"
          ANSIBLE_VAULT_PASSWORD_FILE="$VP" ansible-lint
          rm -f "$VP"

      # Fourni : refuse un vault.yml commite EN CLAIR ; si le secret GitHub
      # existe, verifie qu'il dechiffre bien chaque vault (sortie jetee).
      - name: Ansible Vault chiffre (et dechiffrable si le secret existe)
        working-directory: ansible
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          for f in inventories/*/group_vars/all/vault.yml; do
            [ -f "$f" ] || continue
            if ! head -n1 "$f" | grep -q 'ANSIBLE_VAULT;1'; then
              echo "::error file=ansible/$f::vault.yml en clair"; exit 1
            fi
          done
          if [ -z "$VAULT_PASS" ]; then
            echo "::notice::secret ANSIBLE_VAULT_PASSWORD absent : verification sautee"
            exit 0
          fi
          VP="$RUNNER_TEMP/vault_pass"
          printf '%s\n' "$VAULT_PASS" > "$VP"
          for f in inventories/*/group_vars/all/vault.yml; do
            [ -f "$f" ] || continue
            ansible-vault view --vault-password-file "$VP" "$f" > /dev/null
            echo "OK : $f"
          done
          rm -f "$VP"

      - name: yamllint (manifestes et workflows, regles dans .yamllint)
        run: yamllint k8s .github

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # TODO 3 : verifier le code Terraform du jour 2, SANS compte Azure :
      #   - terraform fmt -check -recursive        (le code est-il bien formate ?)
      #   - pour chaque dossier terraform et terraform-local :
      #       terraform -chdir=<dossier> init -backend=false -input=false
      #       terraform -chdir=<dossier> validate
      #       terraform -chdir=<dossier> test     (seulement si <dossier>/tests existe)
      - name: Terraform fmt, validate et tests
        run: |
          terraform fmt -check -recursive
          for d in terraform terraform-local; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            if [ -d "$d/tests" ]; then
              terraform -chdir="$d" test
            fi
          done

      - name: Installer hadolint et kubeconform (binaires verifies par sha256)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          chmod +x hadolint kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # TODO 4 : analyser app/Dockerfile avec hadolint
      - name: hadolint
        run: hadolint app/Dockerfile

      # (TP6) valide les manifestes Kubernetes s'il y en a
      - name: kubeconform (manifestes Kubernetes valides)
        if: hashFiles('k8s/**/*.yaml') != ''
        run: >-
          kubeconform -strict -summary -kubernetes-version 1.33.1
          -ignore-filename-pattern 'kind-config|kustomization' k8s/

  # ---------------------------------------------------------------------------
  securite:
    name: 2. Securite et conformite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # TODO 5 : gitleaks doit analyser TOUT l'historique Git, pas seulement le dernier commit.
      #          Par defaut, checkout ne recupere que le dernier commit. Quel parametre changer ?
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer gitleaks et trivy (binaires verifies par sha256)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # TODO 6 : detecter les secrets dans l'historique
      #          commande : gitleaks git . --redact --verbose --no-banner
      - name: gitleaks
        run: gitleaks git . --redact --verbose --no-banner

      # TP6 : quand vos manifestes seront termines, retirez "--skip-path k8s"
      #       (ici les squelettes k8s/ du TP6 donneraient 9 echecs normaux)
      - name: checkov (conformite Terraform, Dockerfile, Kubernetes, workflows)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "checkov==3.3.29"
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          checkov -d . --framework terraform dockerfile kubernetes github_actions \
            --skip-path lab --skip-path k8s --compact --quiet

      - name: trivy (mauvaises configurations et dependances vulnerables)
        run: |
          trivy fs . --scanners misconfig,vuln,secret --severity CRITICAL \
            --skip-dirs lab --ignore-unfixed --exit-code 1 --quiet

  # ---------------------------------------------------------------------------
  build:
    name: 3. Build, scan et publication de l'image
    # TODO 7 : ce job ne doit demarrer QUE si les jobs lint ET securite ont reussi
    #          (mot-cle needs)
    needs: [lint, securite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # TODO 8 : ce job a besoin, EN PLUS de lire le code, d'ecrire dans GitHub Packages (GHCR)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nom de l'image (GHCR exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quicknotes" >> "$GITHUB_ENV"

      - name: docker build
        run: |
          docker build app/ \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest"

      # TODO 9 : faire ECHOUER le job si l'image contient une CVE CRITIQUE qui a un correctif.
      #          Completez la derniere ligne avec les bonnes options de trivy image :
      #          --severity ...  --ignore-unfixed  --exit-code ...
      - name: trivy image
        run: |
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy && rm -f trivy_*.tar.gz
          ./trivy image --quiet --severity HIGH,CRITICAL "${IMAGE}:${GITHUB_SHA}"
          ./trivy image --quiet --severity CRITICAL --ignore-unfixed \
            --exit-code 1 "${IMAGE}:${GITHUB_SHA}"

      # TODO 10 : ces deux etapes ne doivent s'executer QUE sur un push sur main
      #           (jamais sur une pull request). Ajoutez la meme condition "if:" aux deux.
      - name: Connexion a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

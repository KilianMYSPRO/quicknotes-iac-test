# MODELE UNIQUEMENT : ne jamais commiter un vrai mot de passe.
# Methode recommandee (rien n'est ecrit sur le disque) :
#   kubectl -n quicknotes create secret generic quicknotes-db \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
# Rappel : un Secret Kubernetes est seulement encode en base64, PAS chiffre.
apiVersion: v1
kind: Secret
metadata:
  name: quicknotes-db
  namespace: quicknotes
type: Opaque
stringData:
  DB_PASSWORD: A_REMPLACER

# Cluster kind du TP6 : 1 control-plane + 2 workers
#   kind create cluster --name quicknotes --config k8s/kind-config.yaml
# Le NodePort 30080 du cluster est publie sur le port 8082 de la VM :
#   http://<IP de la VM>:8082   ou   https://<IP>:8443/proxy/8082/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1      # image compatible kind v0.29.0 (pre-telechargee sur la VM)
    extraPortMappings:
      - containerPort: 30080         # NodePort du Service quicknotes
        hostPort: 8082               # port de la VM
        protocol: TCP
  - role: worker
    image: kindest/node:v1.33.1
  - role: worker
    image: kindest/node:v1.33.1

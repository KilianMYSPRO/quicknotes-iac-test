# QuickNotes - stack locale : reverse proxy + application + base de donnees
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quicknotes
      POSTGRES_USER: quicknotes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans le fichier .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quicknotes -d quicknotes"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  app:
    build: ./app
    image: quicknotes:1.0.0
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_VERSION: 1.0.0
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # attend que Postgres soit PRET, pas juste demarre
    deploy:
      replicas: 2
    networks: [backend, frontend]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

volumes:
  db-data:

networks:
  frontend:
  backend:
    internal: true   # la base n'est pas joignable depuis l'exterieur
